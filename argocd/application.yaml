apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiz-trading
  namespace: argocd
spec:
  project: default
  source:
    # ── Change this to your GitHub repo URL ──
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/aiz-trading
    targetRevision: main
    path: helm/aiz
    helm:
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: aiz
  syncPolicy:
    automated:
      prune: true       # Auto-delete removed resources
      selfHeal: true    # Auto-fix manual changes
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
