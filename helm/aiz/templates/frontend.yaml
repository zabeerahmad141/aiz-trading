apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiz-frontend
  namespace: aiz
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app: aiz-frontend }
  template:
    metadata:
      labels: { app: aiz-frontend }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          imagePullPolicy: Always
          ports: [{ containerPort: 80 }]
          resources: {{ toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aiz
spec:
  selector: { app: aiz-frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiz-ingress
  namespace: aiz
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: aiz-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.global.domain }}]
      secretName: aiz-tls
  {{- end }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8000 } }
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
