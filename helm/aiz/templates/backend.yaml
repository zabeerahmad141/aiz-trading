apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiz-backend
  namespace: aiz
  labels: { app: aiz-backend }
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels: { app: aiz-backend }
  template:
    metadata:
      labels: { app: aiz-backend }
    spec:
      containers:
        - name: backend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: Always
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: aiz-secrets }
            - configMapRef: { name: aiz-config }
          resources: {{ toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aiz
spec:
  selector: { app: aiz-backend }
  ports: [{ port: 8000, targetPort: 8000 }]
