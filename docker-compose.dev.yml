# ══════════════════════════════════════════════════════════
# AI Z — Local Development (Docker Compose)
# Use this for quick testing on Windows WITHOUT K8s/WSL2.
#
# Prerequisites: Docker Desktop installed on Windows
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   Open: http://localhost:3000 (frontend)
#         http://localhost:8000/api/docs (backend API docs)
# ══════════════════════════════════════════════════════════

services:
  postgresql:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiz_trading}
      POSTGRES_USER: ${POSTGRES_USER:-aiz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --requirepass ${REDIS_PASSWORD:-devredis}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-devredis} ping"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgresql
      REDIS_HOST: redis
      APP_ENV: production
    volumes:
      - paper_state:/app/data
    depends_on:
      postgresql: { condition: service_healthy }
      redis:       { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ml-engine:
    build:
      context: ./ml-engine
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgresql
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredis}
      BACKEND_URL: http://backend:8000
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
    volumes:
      - ml_models:/app/models
      - historical_data:/app/data/historical

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:80"]
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  ml_models:
  historical_data:
  paper_state:
