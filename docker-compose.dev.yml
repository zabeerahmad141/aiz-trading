version: "3.9"

# ══════════════════════════════════════════════════════════
# AI Z — Local Development (Docker Compose)
# Use this for quick testing on Windows WITHOUT K8s/WSL2.
#
# Prerequisites: Docker Desktop installed on Windows
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   Open: http://localhost:3000 (frontend)
#         http://localhost:8000/api/docs (backend API docs)
# ══════════════════════════════════════════════════════════

services:
  postgresql:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiz_trading}
      POSTGRES_USER: ${POSTGRES_USER:-aiz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --requirepass ${REDIS_PASSWORD:-devredis}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgresql
      REDIS_HOST: redis
      APP_ENV: development
    depends_on:
      postgresql: { condition: service_healthy }
      redis:       { condition: service_healthy }
    volumes:
      - ./backend:/app   # Hot reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ml-engine:
    build:
      context: ./ml-engine
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgresql
      REDIS_HOST: redis
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ml_models:/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:80"]
    depends_on:
      - backend

volumes:
  pgdata:
  ml_models:
